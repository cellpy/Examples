# Install once:
#   uv sync --group dev
#   uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the `ruff` pin in [dependency-groups] dev.
    rev: v0.16.0
    hooks:
      # Lint before format (fixes can need a reformat pass).
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      # After ruff: strip outputs / execution counts for cleaner git diffs.
      - id: nbstripout
