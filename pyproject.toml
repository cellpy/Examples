[project]
name = "examples"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cellpy[legacy-files]>=2.0.0",
    "cookiecutter>=2.7.1",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.2",
    "kaleido>=1.3.0",
    "marimo>=0.23.15",
    "matplotlib>=3.11.1",
    "nbconvert>=7.17.1",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "polars>=1.43.1",
    "pyarrow>=25.0.0",
]

[dependency-groups]
dev = [
    "nbmake>=1.5.5",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "notebook: execute Jupyter notebooks (slower)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Tutorial notebooks: long comments, and intentional late imports after sys.path hacks.
"*.ipynb" = ["E501", "E402"]
# Cookiecutter templates use Jinja in Python strings; keep diffs small.
"**/cellpy_cookie_NAME/**" = ["E501"]

